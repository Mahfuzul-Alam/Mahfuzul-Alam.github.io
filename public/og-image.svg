  <text x="100" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#FFFFFF" text-anchor="middle">MA</text>
  
  <rect x="144" y="94" width="230" height="32" rx="16" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="1" />
  <circle cx="160" cy="110" r="5" fill="#34C759" />
  <text x="174" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#6E6E73">SDET &amp; Quality Engineering</text>

  <!-- Main Headline & Name -->
  <text x="100" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="56" fill="#1D1D1F" letter-spacing="-1.5">Mahfuzul Alam</text>
