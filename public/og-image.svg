    <text x="80" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#0071E3" text-anchor="middle">2.5+ Years Exp</text>
    
